#
# Our HestiaCP-Pluginable feature to intercept calls to Hestia's bin/
# commands and invoke plugin actions/filters.
# 

# Check if bin_actions is set and if it is, then return
if [ -n "$bin_actions" ]; then
    return
fi

# Set bin_actions to prevent re-entry
export bin_actions=1

# Get the script name
script_name=$(basename "$0")

# Do not intercept the backup/dns queues: the double-run guard in v-update-sys-queue
# counts processes via "ps auxf | grep", and the pluginable wrapper adds extra
# processes, so the queue silently exits and never runs.
if [ "$script_name" = "v-update-sys-queue" ] && { [ "$1" = "backup" ] || [ "$1" = "dns" ]; }; then
    return
fi

# Invoke php script to run the original v-* command, allowing for plugin hooks
# to modify arguments and output.
# Arguments are passed through as-is (no printf %q re-encoding), so values that
# contain backslashes (passwords, cron commands like "find ... -exec ... \;") stay intact.
php -f /etc/hestiacp/hooks/pluginable.php -- "$script_name" "$@"
exit
